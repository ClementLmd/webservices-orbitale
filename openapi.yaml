# Contrat OpenAPI de l'API Orbitale (S2).
openapi: 3.1.0
info:
  title: API Orbitale
  version: 1.0.0
  summary: Billetterie d'événements
  description: |
    API REST de la plateforme Orbitale.
    Les erreurs suivent la RFC 9457 (application/problem+json).
  contact:
    name: Équipe API Orbitale
    email: api@orbitale.test
servers:
  - url: http://localhost:3000
    description: Développement local
tags:
  - name: Événements
    description: Catalogue des événements
  - name: Billets
    description: Billets délivrés après une commande
  - name: Commandes
    description: Achats de billets
  - name: Scans
    description: Contrôles d'entrée aux bornes

paths:
  /v1/events:
    get:
      tags: [Événements]
      operationId: listEvents
      summary: Lister les événements
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrer par statut
          schema:
            type: string
            enum: [draft, published, cancelled]
      responses:
        "200":
          description: La collection des événements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
              example:
                data:
                  - id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    title: Nuit électro
                    description: null
                    venue: Le Zénith, Paris
                    startsAt: "2027-03-19T20:00:00.000Z"
                    capacity: 6000
                    remaining: 5874
                    price: 3900
                    currency: EUR
                    status: published
                    createdAt: "2026-11-20T10:00:00.000Z"
                    updatedAt: "2026-11-20T10:00:00.000Z"
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Événements]
      operationId: createEvent
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
            example:
              title: Nuit électro
              venue: Le Zénith
              startsAt: "2027-03-19T20:00:00Z"
              capacity: 6000
              price: 3900
              status: published
      responses:
        "201":
          description: Événement créé
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith
                startsAt: "2027-03-19T20:00:00.000Z"
                capacity: 6000
                remaining: 6000
                price: 3900
                currency: EUR
                status: published
                createdAt: "2026-11-20T10:00:00.000Z"
                updatedAt: "2026-11-20T10:00:00.000Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Événements]
      operationId: getEvent
      summary: Lire un événement
      responses:
        "200":
          description: L'événement demandé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith, Paris
                startsAt: "2027-03-19T20:00:00.000Z"
                capacity: 6000
                remaining: 5874
                price: 3900
                currency: EUR
                status: published
                createdAt: "2026-11-20T10:00:00.000Z"
                updatedAt: "2026-11-20T10:00:00.000Z"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Événements]
      operationId: patchEvent
      summary: Modifier un événement
      description: Une capacité inférieure aux billets déjà vendus répond 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
            example:
              title: Nuit électro — report
      responses:
        "200":
          description: L'événement modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Événements]
      operationId: deleteEvent
      summary: Supprimer un événement
      description: Refusée avec 409 si des billets ont déjà été vendus.
      responses:
        "204":
          description: Événement supprimé
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tickets/{ticketId}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      tags: [Billets]
      operationId: getTicket
      summary: Lire un billet
      responses:
        "200":
          description: Le billet demandé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
              example:
                id: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                code: ORB-A1B2C3D4E5F6
                status: valid
                usedAt: null
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orders:
    post:
      tags: [Commandes]
      operationId: createOrder
      summary: Créer une commande
      description: Répond 409 si l'événement n'a plus assez de places.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
            example:
              eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
              quantity: 2
              buyerEmail: ada@example.com
      responses:
        "201":
          description: Commande créée
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                quantity: 2
                buyerEmail: ada@example.com
                status: paid
                total: 7800
                tickets:
                  - id: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                    orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
                  - id: 9d3b2e5f-2c80-4d4b-af31-6b7c8d9e0f1a
                    orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-B2C3D4E5F6A1
                    status: valid
                    usedAt: null
                createdAt: "2026-11-20T10:05:00.000Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Commandes]
      operationId: getOrder
      summary: Lire une commande
      responses:
        "200":
          description: La commande demandée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                quantity: 2
                buyerEmail: ada@example.com
                status: paid
                total: 7800
                tickets:
                  - id: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                    orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
                  - id: 9d3b2e5f-2c80-4d4b-af31-6b7c8d9e0f1a
                    orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-B2C3D4E5F6A1
                    status: valid
                    usedAt: null
                createdAt: "2026-11-20T10:05:00.000Z"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Commandes]
      operationId: patchOrder
      summary: Modifier une commande
      description: Annuler, c'est envoyer {"status":"cancelled"}. Répond 409 si un billet a déjà été scanné.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderPatch" }
            example:
              status: cancelled
      responses:
        "200":
          description: La commande modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orders/{orderId}/tickets:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Billets]
      operationId: listOrderTickets
      summary: Lister les billets d'une commande
      responses:
        "200":
          description: Les billets de la commande
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketList" }
              example:
                data:
                  - id: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                    orderId: 3a9e1c2b-7d4f-4a8e-b1c0-2d3e4f5a6b7c
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/scans:
    get:
      tags: [Scans]
      operationId: listScans
      summary: Lister les contrôles d'un événement
      parameters:
        - name: eventId
          in: query
          required: false
          description: Limiter aux entrées de cet événement
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Les scans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanList" }
              example:
                data:
                  - id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    ticketId: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                    gateId: porte-a
                    scannedAt: "2027-03-19T20:05:00.000Z"
                    result: accepted
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Scans]
      operationId: createScan
      summary: Contrôler un billet à une borne
      description: Répond 409 si ce billet a déjà un scan accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanCreate" }
            example:
              code: ORB-A1B2C3D4E5F6
              gateId: porte-a
      responses:
        "201":
          description: Scan enregistré
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
              example:
                id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                ticketId: 8c2a1d4e-1b7f-4c3a-9e20-5a6b7c8d9e0f
                gateId: porte-a
                scannedAt: "2027-03-19T20:05:00.000Z"
                result: accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Requête illisible (JSON mal formé)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Validation:
      description: Le corps ne respecte pas le contrat
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
          example:
            type: "https://api.orbitale.test/problems/validation"
            title: Requête invalide
            status: 422
            detail: Le corps de la requête ne respecte pas le contrat
            instance: /v1/events
            errors:
              - field: title
                message: Doit contenir au moins 3 caractères
    Conflict:
      description: Conflit avec l'état de la ressource
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  headers:
    Location:
      description: URI de la ressource créée
      schema: { type: string }
      example: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23

  schemas:
    Problem:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: "https://api.orbitale.test/problems/not-found"
        title: { type: string, example: Ressource introuvable }
        status: { type: integer, example: 404 }
        detail: { type: string, example: Événement introuvable }
        instance:
          type: string
          example: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23

    ValidationProblem:
      description: Problème de validation, avec le détail par champ
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: capacity }
                  message: { type: string, example: Doit être supérieur ou égal à 1 }

    Event:
      type: object
      required:
        [
          id,
          title,
          venue,
          startsAt,
          capacity,
          remaining,
          price,
          currency,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        remaining:
          type: integer
          readOnly: true
          description: Places encore disponibles
        price:
          type: integer
          minimum: 0
          description: Prix en centimes (3900 = 39,00 €)
        currency: { type: string, enum: [EUR] }
        status: { type: string, enum: [draft, published, cancelled] }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    EventList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    EventCreate:
      type: object
      additionalProperties: false
      required: [title, venue, startsAt, capacity, price]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price:
          type: integer
          minimum: 0
          description: Prix en centimes (3900 = 39,00 €)
        status:
          type: string
          enum: [draft, published]
          default: draft

    EventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price:
          type: integer
          minimum: 0
          description: Prix en centimes (3900 = 39,00 €)
        status: { type: string, enum: [draft, published, cancelled] }

    Ticket:
      type: object
      required: [id, orderId, eventId, code, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^ORB-[0-9A-F]{12}$"
          description: ORB- suivi de 12 caractères hexadécimaux majuscules
          example: ORB-A1B2C3D4E5F6
        status: { type: string, enum: [valid, used, cancelled] }
        usedAt:
          type: [string, "null"]
          format: date-time

    TicketList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }

    OrderCreate:
      type: object
      additionalProperties: false
      required: [eventId, quantity, buyerEmail]
      properties:
        eventId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        buyerEmail: { type: string, format: email }

    Order:
      type: object
      required: [id, eventId, quantity, buyerEmail, status, total, tickets, createdAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        eventId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        buyerEmail: { type: string, format: email }
        status: { type: string, enum: [pending, paid, cancelled] }
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Total en centimes
        tickets:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/Ticket" }
        createdAt: { type: string, format: date-time, readOnly: true }

    OrderPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [cancelled] }

    ScanCreate:
      type: object
      additionalProperties: false
      required: [code, gateId]
      properties:
        code:
          type: string
          pattern: "^ORB-[0-9A-F]{12}$"
        gateId: { type: string, minLength: 1, maxLength: 40 }

    Scan:
      type: object
      required: [id, ticketId, gateId, scannedAt, result]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ticketId: { type: string, format: uuid, readOnly: true }
        gateId: { type: string, minLength: 1, maxLength: 40 }
        scannedAt: { type: string, format: date-time, readOnly: true }
        result: { type: string, enum: [accepted, rejected] }

    ScanList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Scan" }
