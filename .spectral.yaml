# Règles de style du contrat Orbitale : npx --yes @stoplight/spectral-cli@6 lint openapi.yaml
extends: ["spectral:oas"]

rules:
  # Règle fournie : chaque opération a un identifiant stable (utile pour générer des clients)
  orbitale-operation-id:
    description: Chaque opération doit avoir un operationId
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: operationId
      function: truthy

  # Règle fournie : toute erreur 4xx/5xx est décrite en application/problem+json
  orbitale-erreurs-problem-json:
    description: Toute réponse 4xx/5xx doit être décrite en application/problem+json
    message: "Réponse d'erreur sans contenu application/problem+json (RFC 9457)"
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^[45]/))]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: ["application/problem+json"]

  orbitale-pas-de-verbe:
    description: Un chemin ne doit contenir aucun verbe
    message: "{{path}} contient un verbe (create, get, update, delete)."
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "/(create|get|update|delete)"

  operation-description: off
